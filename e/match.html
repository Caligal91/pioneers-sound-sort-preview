<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Read &amp; Match · Short e · Pioneers Tutoring</title>
<style>
@font-face{font-family:Fredoka;src:url(../Fredoka.ttf)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:Fredoka,'Comic Sans MS',sans-serif;color:#1e2837;background:linear-gradient(#ffe7c2,#fff9ee);overflow:hidden;user-select:none;-webkit-user-select:none}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center}
.screen.on{display:flex}
h1{font-size:clamp(34px,6vw,64px);margin:5vh 0 1vh;color:#e0721a;text-shadow:0 3px 0 #fff}
.sub{font-size:clamp(18px,2.6vw,26px);margin-bottom:3vh;text-align:center;padding:0 20px}
.btn{font-family:inherit;font-size:clamp(20px,3vw,30px);border:0;border-radius:22px;padding:16px 34px;margin:9px;color:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.18);min-width:270px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn small{display:block;font-size:.6em;opacity:.92}
.e{background:#2a9d5c}.c{background:#e08a00}.x{background:#a64ac9}.b{background:#2f6fde}
#top{width:100%;display:flex;justify-content:space-between;align-items:center;padding:10px 18px;font-size:clamp(18px,2.6vw,28px)}
#stars{color:#e0a100;font-weight:600}
.mini{background:#fff;border:3px solid #1e2837;border-radius:14px;padding:4px 14px;font-family:inherit;font-size:inherit;cursor:pointer;color:#1e2837}
#prog{display:flex;gap:6px}
#prog i{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid #1e2837}
#prog i.d{background:#2a9d5c}
#scene{display:flex;align-items:flex-end;gap:2vw;margin-top:1vh}
#koala{width:clamp(80px,12vw,140px)}
#word{background:#fff;border:6px solid #1e2837;border-radius:30px;padding:10px 40px;font-size:clamp(46px,8vw,96px);font-weight:600;min-width:240px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.12);position:relative}
#word.long{font-size:clamp(26px,4vw,46px);max-width:80vw}
#hear{position:absolute;right:-22px;top:-22px;width:52px;height:52px;border-radius:50%;border:4px solid #1e2837;background:#ffd84d;font-size:24px;cursor:pointer;display:none}
#prompt{font-size:clamp(18px,2.6vw,28px);margin:3vh 0 1.5vh}
#pics{display:flex;gap:clamp(12px,3vw,40px);justify-content:center;flex-wrap:wrap}
.pic{width:clamp(130px,20vw,220px);height:clamp(130px,20vw,220px);background:#fff;border:5px solid #1e2837;border-radius:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.12);transition:transform .12s}
.pic img{width:72%;pointer-events:none}
.pic:active{transform:scale(.95)}
.pic.ok{background:#dff5e6;border-color:#2a9d5c;transform:scale(1.08)}
.pic.no{animation:wig .45s;opacity:.35;pointer-events:none}
@keyframes wig{0%,100%{translate:0}25%{translate:-12px}50%{translate:12px}75%{translate:-6px}}
.fb{font-size:clamp(26px,4.5vw,48px);font-weight:600;height:1.4em;margin-top:2vh;color:#2a9d5c}
.big{color:#e0a100;font-size:clamp(60px,12vw,140px);margin:2vh 0}
.conf{position:absolute;width:12px;height:18px;top:-20px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.foot{position:absolute;bottom:8px;font-size:12px;color:#778}
.red{color:#e8231f}
@media (max-width:520px){#prog{gap:3px}#prog i{width:11px;height:11px}#top{padding:8px 10px}}
</style>
</head>
<body>
<div class="screen on" id="start">
  <h1>Read &amp; Match</h1>
  <div class="sub">Koala needs help! Read the word, then tap the picture that matches.</div>
  <button class="btn e" onclick="start('e')">Emerging<small>bed · pen · hen</small></button>
  <button class="btn c" onclick="start('c')">Consolidating<small>nest · tent · dress</small></button>
  <button class="btn x" onclick="start('x')">Extending<small>helmet · penguin · sentences</small></button>
  <a href="index.html" class="btn b" style="text-decoration:none;text-align:center">All games</a>
  <div class="foot">Pioneers Tutoring · Pictures: Microsoft Fluent Emoji (MIT)</div>
</div>

<div class="screen" id="game">
  <div id="top"><button class="mini" onclick="show('start')">⟵ Menu</button><div id="prog"></div><div id="stars">★ 0</div></div>
  <div id="scene"><img id="koala" src="../img/koala.png" alt=""><div id="word"><span id="wtext"></span><button id="hear" title="Hear it">🔊</button></div></div>
  <div id="prompt">Read it. Tap the matching picture.</div>
  <div id="pics"></div>
  <div class="fb" id="fb"></div>
</div>

<div class="screen" id="end">
  <h1>Super reading!</h1>
  <div class="big" id="endstars"></div>
  <div class="sub" id="endtxt"></div>
  <button class="btn b" onclick="start(mode)">Play again</button>
  <button class="btn c" onclick="show('start')">Menu</button>
</div>

<script>
// [word to read, correct picture, two look-alike pictures]
const SETS={
 e:[['bed','bed','bell','bag'],['pen','pen','pin','pan'],['hen','hen','ten','hat'],['web','web','bed','bug'],['leg','leg','egg','log'],
    ['ten','ten','tent','tin'],['men','men','man','hen'],['net','net','nest','web'],['egg','egg','leg','bed']],
 c:[['nest','nest','net','egg'],['tent','tent','ten','nest'],['sled','sled','bed','sock'],['dress','dress','vest','drum'],['vest','vest','dress','nest'],
    ['bell','bell','bed','shell'],['shell','shell','bell','ship'],['elf','elf','egg','leg'],['frog','frog','flag','fox'],['chick','chick','duck','egg']],
 x:[['helmet','helmet','hen','melon'],['tennis','tennis','ten','tent'],['penguin','penguin','pencil','pen'],['lemon','lemon','melon','leg'],
    ['melon','melon','lemon','men'],['elephant','elephant','egg','elf'],
    ['Ted fed the red hen.','hen','egg','bed'],['The egg is in the nest.','nest','net','bed'],['Ben fell off the sled.','sled','bed','bell'],['Jess got a red pen.','pen','pin','pencil'],['Fred slept in the tent.','tent','sled','bell']]
};
const IMG={ten:'keycap10'};
let mode='e',deck=[],idx=0,stars=0,first=0,tries=0;
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let voice=null;function pick(){const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en-AU/i.test(v.lang))||vs.find(v=>/en-GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;}
if('speechSynthesis' in window){pick();speechSynthesis.onvoiceschanged=pick;}
function tts(t,r){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);if(voice)u.voice=voice;u.lang=voice?voice.lang:'en-AU';u.rate=r||.85;speechSynthesis.speak(u);}

// Australian ElevenLabs voice (Sophia) clips, with the device voice as a fallback
// short e sentence clips are se-0 … se-4 (the short a ones are s-0 … s-4)
const SENTS=["Ted fed the red hen.", "The egg is in the nest.", "Ben fell off the sled.", "Jess got a red pen.", "Fred slept in the tent."];
const PHR={'Great listening!':'p-great','Yes!':'p-yes','You got it!':'p-gotit','Super!':'p-super','You read it!':'p-read','Great reading!':'p-greatread','Listen again.':'p-again','Fantastic sorting!':'p-sorting','Super reading!':'p-reading','short a.':'p-shorta','short e.':'p-e','short i.':'p-i','short o.':'p-o','short u.':'p-u'};
const clipFor=t=>{t=t.trim(); if(PHR[t])return PHR[t]; if(/^[a-z]+$/.test(t))return 'w-'+t; const i=SENTS.indexOf(t); return i>=0?'se-'+i:null;};
let curAudio=null;
function sayQ(list){ if(curAudio){curAudio.pause();curAudio=null;} if('speechSynthesis' in window)speechSynthesis.cancel();
  const go=k=>{ if(k>=list.length)return; const t=list[k], c=clipFor(t);
    if(!c){ tts(t); return go(k+1);} const a=new Audio('../voice/'+c+'.mp3'); curAudio=a; a.onended=()=>setTimeout(()=>go(k+1),250); a.onerror=()=>{tts(t);}; a.play().catch(()=>tts(t)); };
  go(0);}
function say(t){ sayQ([t]); }

let ac=null;function tone(f,d,t){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.setValueAtTime(.18,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
const yay=()=>{tone(660,.15);setTimeout(()=>tone(880,.2),120);setTimeout(()=>tone(1320,.25),240);};
const oops=()=>tone(180,.25,'triangle');
function start(m){mode=m;deck=shuffle(SETS[m].map(x=>[...x])).slice(0,8);idx=0;stars=0;first=0;$('prog').innerHTML=deck.map(()=>'<i></i>').join('');$('stars').textContent='★ 0';show('game');next();}
function next(){if(idx>=deck.length)return finish();tries=0;const [w,ans,...d]=deck[idx];
  // Emerging: red short e inside the word (highlighting fades in later stages, like the readers)
  $('wtext').innerHTML=mode==='e'?w.replace('e','<span class="red">e</span>'):w;
  $('word').classList.toggle('long',w.includes(' '));$('hear').style.display='none';$('fb').textContent='';
  const P=$('pics');P.innerHTML='';shuffle([ans,...d]).forEach(p=>{const b=document.createElement('div');b.className='pic';b.innerHTML=`<img src="../img/${IMG[p]||p}.png" alt="">`;b.onclick=()=>choose(b,p===ans);P.appendChild(b);});}
function choose(b,ok){const w=deck[idx][0];
  if(ok){if(tries===0){stars++;first++;}$('stars').textContent='★ '+stars;b.classList.add('ok');yay();const ph=['You read it!','Yes!','Great reading!','Super!'][Math.floor(Math.random()*4)];$('fb').textContent=ph;sayQ([ph,w]);
    $('prog').children[idx].classList.add('d');idx++;document.querySelectorAll('.pic').forEach(p=>p.onclick=null);setTimeout(next,1500);}
  else{tries++;oops();b.classList.add('no');$('fb').textContent='';
    // after a wrong try: sound it out together, and show the hear button as a help
    $('hear').style.display='block';
    if(!w.includes(' '))sayQ([w]);}}
$('hear').onclick=e=>{e.stopPropagation();say(deck[idx][0]);};
function finish(){const n=deck.length;$('endstars').textContent='★'.repeat(Math.max(1,Math.round(stars/n*5)));$('endtxt').textContent=`You matched all ${n}. ${first} right first time!`;show('end');yay();say('Super reading!');
  for(let i=0;i<60;i++){const s=document.createElement('div');s.className='conf';s.style.left=Math.random()*100+'vw';s.style.background=['#e8231f','#2f6fde','#2a9d5c','#e0a100','#a64ac9'][i%5];s.style.animationDuration=(1.5+Math.random()*2)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),4000);}}
</script>
</body>
</html>
