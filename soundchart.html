<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sound Chart · Pioneers Tutoring</title>
<style>
@font-face{font-family:Fredoka;src:url(Fredoka.ttf)}
:root{--v:#e8231f;--c:#1d4fd8;--ink:#1e2837;--side:var(--v);--soft:#fff1ef}
body.cons{--side:var(--c);--soft:#eef3ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:Fredoka,'Comic Sans MS',sans-serif;color:var(--ink);background:linear-gradient(#ffe7c2,#fff9ee) fixed}
body{padding:0 0 env(safe-area-inset-bottom)}
button{font-family:inherit;color:inherit}
/* top bar */
#bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 14px;background:rgba(255,249,238,.94);backdrop-filter:blur(6px);border-bottom:3px solid rgba(30,40,55,.08)}
.mini{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:4px 12px;font-size:18px;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
h1{margin:0;font-size:clamp(20px,2.6vw,30px);color:#e0721a;text-shadow:0 2px 0 #fff;white-space:nowrap}
#flip{display:flex;border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:#fff}
#flip button{border:0;background:#fff;font-size:19px;padding:6px 16px;cursor:pointer;font-weight:600}
#flip button.on.v{background:var(--v);color:#fff}#flip button.on.c{background:var(--c);color:#fff}
#find{flex:1;min-width:150px;max-width:300px;display:flex;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:0 10px}
#q{border:0;outline:0;font:inherit;font-size:19px;padding:5px 4px;width:100%;background:transparent;color:var(--ink)}
#q::placeholder{color:#99a}
#mute{font-size:20px;padding:3px 10px}
/* search results */
#res{display:none;flex-wrap:wrap;gap:8px;padding:8px 14px 0;align-items:center}
#res.on{display:flex}
#res .lab{font-size:16px;color:#556}
.chip{display:flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:3px 10px 3px 4px;cursor:pointer;font-size:17px}
.chip img{width:34px;height:34px}
.chip .g{font-weight:600;font-size:22px}
.chip.vowel .g,.chip.vowel b.hl{color:var(--v)}.chip.consonant .g,.chip.consonant b.hl{color:var(--c)}
.chip .arrow{color:#889}
/* chart */
#stage{perspective:1600px;padding:8px 10px 18px}
#chart{display:flex;flex-wrap:wrap;gap:10px 14px;justify-content:center;transform-origin:50% 30%;transition:transform .22s ease-in,opacity .22s}
#chart.turn{transform:rotateY(88deg);opacity:.2}
.grp{display:flex;flex-direction:column;align-items:flex-start}
.gh{font-size:16px;font-weight:600;color:#fff;background:var(--side);border-radius:10px 10px 0 0;padding:2px 12px;margin-left:10px}
.gh small{font-weight:400;opacity:.9;margin-left:6px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;background:rgba(255,255,255,.55);border:3px solid var(--side);border-radius:18px;padding:8px}
.tile{position:relative;width:var(--tw,128px);height:var(--th,168px);background:#fff;border:3px solid var(--ink);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:13px 4px 6px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.13);transition:transform .12s,opacity .2s,box-shadow .2s}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.13)}
.tile .gr{font-size:calc(var(--tw,128px)*.36);line-height:1.05;font-weight:600;color:var(--side)}
.tile img{height:44%;max-width:74%;min-height:0;object-fit:contain;pointer-events:none}
.tile .kw{font-size:calc(var(--tw,128px)*.15);line-height:1.1;white-space:nowrap}
.tile .nm{position:absolute;top:2px;left:7px;font-size:12px;color:#778}
.tile .more{position:absolute;top:3px;right:5px;font-size:12px;color:#fff;background:var(--side);border-radius:9px;padding:0 6px}
b.hl{color:var(--side);font-weight:600}
.dim .tile{opacity:.28}.dim .tile.hit{opacity:1;box-shadow:0 0 0 5px #ffd84d,0 5px 0 rgba(0,0,0,.13)}
/* panel */
#ov{position:fixed;inset:0;z-index:20;background:rgba(30,40,55,.45);display:none;align-items:center;justify-content:center;padding:12px}
#ov.on{display:flex}
#panel{position:relative;background:#fff;border:5px solid var(--ink);border-radius:28px;width:min(1040px,100%);max-height:100%;overflow:auto;box-shadow:0 10px 0 rgba(0,0,0,.18);padding:14px 18px 18px;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}}
#ph{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-right:52px}
#pbig{font-size:clamp(56px,8vw,84px);line-height:1;font-weight:600;color:var(--side);min-width:1.2em;text-align:center}
#pname{font-size:clamp(22px,3vw,30px);font-weight:600;flex:0 1 auto;min-width:150px}
#pname small{display:block;font-size:16px;font-weight:400;color:#667}
#hearS{background:#ffd84d;border:3px solid var(--ink);border-radius:16px;font-size:19px;padding:6px 14px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15)}
#hearS:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
#close{position:absolute;top:10px;right:10px;width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-size:24px;cursor:pointer}
#tip{margin:10px 0 12px;background:var(--soft);border-left:6px solid var(--side);border-radius:10px;padding:7px 12px;font-size:clamp(15px,1.9vw,18px)}
#tip b{color:var(--side)}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{position:relative;border:3px solid var(--ink);border-radius:20px;background:#fff;display:flex;flex-direction:column;align-items:center;padding:8px 6px 10px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.card:active{transform:translateY(3px)}
.card .g{font-size:46px;font-weight:600;color:var(--side);line-height:1.05}
.card img{width:92px;height:92px;object-fit:contain;margin:4px 0;pointer-events:none}
.card .w{font-size:26px;line-height:1.1}
.card .n{font-size:13px;color:#667;margin-top:3px;text-align:center}
.card .ord{position:absolute;top:5px;left:9px;font-size:12px;color:#99a}
.card.hit{background:#fff8d6;box-shadow:0 0 0 5px #ffd84d,0 5px 0 rgba(0,0,0,.12)}
.card.say,.tile.say{animation:bop .5s}
@keyframes bop{40%{transform:scale(1.07)}}
#nav{display:flex;justify-content:space-between;margin-top:14px;gap:10px}
#nav button{font-size:18px}
.foot{text-align:center;font-size:12px;color:#778;padding:4px 0 10px}
/* phone */
@media (max-width:600px){
 #bar{gap:6px;padding:6px 8px}
 h1{display:none}
 #find{order:5;max-width:none;flex-basis:100%}
 #flip button{font-size:17px;padding:5px 11px}
 .tiles{gap:6px;padding:6px}
 .grp{width:100%}
 .tiles{width:100%;justify-content:center}
 #cards{grid-template-columns:repeat(2,1fr)}
 #pname{flex:1 1 150px} #ph{gap:8px 12px} #hearS{font-size:17px;padding:4px 12px}
 .card .g{font-size:40px}.card img{width:76px;height:76px}.card .w{font-size:23px}
}
</style>
</head>
<body>
<div id="bar">
  <a class="mini" href="index.html" title="All games">⟵ Games</a>
  <h1>Sound Chart</h1>
  <div id="flip" role="tablist">
    <button class="v on" data-side="vowel" role="tab">Vowels</button><button class="c" data-side="consonant" role="tab">Consonants</button>
  </div>
  <label id="find">🔎<input id="q" type="search" placeholder="Find a spelling… (ph, igh)" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
  <button class="mini" id="mute" title="Sound on/off">🔊</button>
</div>
<div id="res"></div>
<div id="stage"><div id="chart"></div></div>
<div class="foot">Pioneers Tutoring · 44 sounds of Australian English · Voice: ElevenLabs (Sophia) · Pictures: made with ChatGPT</div>

<div id="ov"><div id="panel" role="dialog" aria-modal="true">
  <button id="close" title="Close">✕</button>
  <div id="ph"><div id="pbig"></div><div id="pname"></div><button id="hearS">🔊 Hear the sound</button></div>
  <div id="tip"></div>
  <div id="cards"></div>
  <div id="nav"><button class="mini" id="prev">⟵</button><button class="mini" id="next">⟶</button></div>
</div></div>

<script src="soundchart-data.js"></script>
<script>
const D=SOUNDCHART, SND=D.sounds, $=id=>document.getElementById(id);
const ORDER={vowel:['short','schwa','long','rvowel','twopart'],consonant:['pop','pophiss','hiss','hum','glide']};
let side='vowel', cur=-1, muted=false;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mark=hl=>esc(hl).replace(/\[([^\]]*)\]/g,'<b class="hl">$1</b>');

// ---- audio: Sophia clips in a queue, device voice as fallback (same pattern as the games) ----
let voice=null;function pickV(){const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en-AU/i.test(v.lang))||vs.find(v=>/en-GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;}
if('speechSynthesis' in window){pickV();speechSynthesis.onvoiceschanged=pickV;}
function tts(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);if(voice)u.voice=voice;u.lang=voice?voice.lang:'en-AU';u.rate=.85;speechSynthesis.speak(u);}
let curAudio=null;
function sayQ(list){ if(curAudio){curAudio.pause();curAudio=null;} if('speechSynthesis' in window)speechSynthesis.cancel(); if(muted)return;
  const go=k=>{ if(k>=list.length)return; const [clip,text]=list[k];
    const a=new Audio(clip); curAudio=a; a.onended=()=>setTimeout(()=>go(k+1),250); a.onerror=()=>{tts(text);}; a.play().catch(()=>tts(text)); };
  go(0);}
const pure=s=>['voice/pure-'+s.id+'.mp3',''];
const sayWord=p=>sayQ([[p.clip,p.word]]);
const sayTile=(s,p)=>sayQ([pure(s),pure(s),[p.clip,p.word]]);
const saySound=s=>sayQ([pure(s),pure(s),[s.clip,'This sound is in '+s.spellings.slice(0,3).map(p=>p.word).join(', ')]]);
function bop(el){el.classList.remove('say');void el.offsetWidth;el.classList.add('say');}

// ---- chart ----
function sizeTiles(){ // fit the side on one landscape screen; phones scroll
  const W=innerWidth,H=innerHeight, perRow=side==='vowel'?8:9, rows=3;
  let tw=Math.floor((Math.min(W,1500)-60-(perRow+3)*10)/perRow);
  const avail=H-$('bar').offsetHeight-40-rows*58; let th=Math.floor(avail/rows);
  if(W<=600){tw=Math.floor((W-64)/3);th=Math.round(tw*1.3);}
  else{tw=Math.max(96,Math.min(tw,170));th=Math.max(122,Math.min(th,Math.round(tw*1.35)));tw=Math.min(tw,Math.round(th*.86));}
  document.body.style.setProperty('--tw',tw+'px');document.body.style.setProperty('--th',th+'px');}
function build(){
  document.body.classList.toggle('cons',side==='consonant');
  document.querySelectorAll('#flip button').forEach(b=>b.classList.toggle('on',b.dataset.side===side));
  const C=$('chart');C.innerHTML='';
  ORDER[side].forEach(g=>{
    const grp=document.createElement('div');grp.className='grp';
    grp.innerHTML=`<div class="gh">${esc(D.groups[g])}<small>${esc(D.groupInfo[g])}</small></div><div class="tiles"></div>`;
    SND.forEach((s,i)=>{ if(s.group!==g)return; const p=s.spellings[0];
      const t=document.createElement('div');t.className='tile';t.dataset.i=i;t.tabIndex=0;
      t.innerHTML=(s.name!==s.label?`<span class="nm">${esc(s.name)}</span>`:'')+(s.spellings.length>1?`<span class="more" title="${s.spellings.length} spellings">${s.spellings.length}</span>`:'')+
        `<div class="gr">${esc(s.label)}</div><img src="${p.picture}" alt="${esc(p.word)}"><div class="kw">${mark(p.hl)}</div>`;
      t.onclick=()=>{bop(t);open(i);sayTile(s,p);};
      t.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();t.onclick();}};
      grp.querySelector('.tiles').appendChild(t);});
    C.appendChild(grp);});
  sizeTiles(); applyFind();}
function flipTo(s){ if(s===side)return; const C=$('chart');C.classList.add('turn');
  setTimeout(()=>{side=s;build();C.classList.remove('turn');},220);}
document.querySelectorAll('#flip button').forEach(b=>b.onclick=()=>flipTo(b.dataset.side));

// ---- panel ----
function sideList(){return ORDER[side].flatMap(g=>SND.map((s,i)=>[s,i]).filter(([s])=>s.group===g).map(([,i])=>i));}
function open(i,hitG){ cur=i; const s=SND[i]; if(s.type!==side){side=s.type;build();}
  $('pbig').textContent=s.label;
  $('pname').innerHTML=`${esc(s.name)}${s.name===s.label?' sound':''}<small>/${esc(s.ipa)}/ · ${esc(D.groups[s.group])} · ${s.spellings.length} spelling${s.spellings.length>1?'s':''}</small>`;
  $('tip').innerHTML=`<b>Tutor tip:</b> ${esc(s.tip)}`;
  const C=$('cards');C.innerHTML='';
  s.spellings.forEach((p,k)=>{const c=document.createElement('div');c.className='card'+(hitG&&p.grapheme===hitG?' hit':'');
    c.innerHTML=`<span class="ord">${k+1}</span><div class="g">${esc(p.grapheme)}</div><img src="${p.picture}" alt=""><div class="w">${mark(p.hl)}</div>${p.note?`<div class="n">${esc(p.note)}</div>`:''}`;
    c.onclick=()=>{bop(c);sayWord(p);};C.appendChild(c);});
  $('ov').classList.add('on');}
function close(){$('ov').classList.remove('on');cur=-1;if(curAudio)curAudio.pause();}
function step(d){const L=sideList(),k=L.indexOf(cur);if(k<0)return;const n=L[(k+d+L.length)%L.length];open(n);sayWord(SND[n].spellings[0]);}
$('close').onclick=close;$('ov').onclick=e=>{if(e.target.id==='ov')close();};
$('hearS').onclick=()=>{if(cur>=0)saySound(SND[cur]);};
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
document.addEventListener('keydown',e=>{
  if($('ov').classList.contains('on')){if(e.key==='Escape')close();else if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1);return;}
  if(e.key==='/'&&document.activeElement!==$('q')){e.preventDefault();$('q').focus();}});
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';if(muted&&curAudio)curAudio.pause();};

// ---- find a spelling ----
const normQ=q=>q.toLowerCase().replace(/[^a-z_\- ]/g,'').trim().replace(/[\s\-]+/g,'_');
function findHits(q){ if(!q)return[]; const out=[], bare=q.replace(/_/g,'');
  SND.forEach((s,i)=>s.spellings.forEach(p=>{const g=p.grapheme; let r=-1;
    if(g===q||(g.includes('_')&&g.replace('_','')===bare&&bare.length>1))r=0;          // exact spelling (a_e from "a-e"/"ae")
    else if(q.length>1&&g.startsWith(q))r=1;                                      // start of a spelling
    else if(q.length>2&&p.word.startsWith(q))r=2;                                // a keyword
    if(r>=0)out.push({r,i,p,s});}));
  return out.sort((a,b)=>a.r-b.r);}
function applyFind(){ const q=normQ($('q').value), hits=findHits(q), R=$('res');
  const best=hits.length?Math.min(...hits.map(h=>h.r)):0, top=hits.filter(h=>h.r===best);
  $('chart').classList.toggle('dim',!!q);
  document.querySelectorAll('.tile').forEach(t=>t.classList.toggle('hit',top.some(h=>h.i==t.dataset.i)));
  if(!q){R.classList.remove('on');R.innerHTML='';return;}
  R.classList.add('on');
  if(!hits.length){R.innerHTML=`<span class="lab">No spelling “${esc(q)}” on the chart. Try fewer letters.</span>`;return;}
  R.innerHTML='<span class="lab">'+(best===0?`<b>${esc(q)}</b> can spell:`:best===1?'Spellings starting with '+esc(q)+':':'Keywords:')+'</span>';
  top.slice(0,10).forEach(h=>{const c=document.createElement('div');c.className='chip '+h.s.type;
    c.innerHTML=`<img src="${h.p.picture}" alt=""><span class="g">${esc(h.p.grapheme)}</span><span class="arrow">→</span><span><b>${esc(h.s.name)}</b> ${h.s.name===h.s.label?'sound':''} in ${mark(h.p.hl)}</span>`;
    c.onclick=()=>{open(h.i,h.p.grapheme);sayWord(h.p);};R.appendChild(c);});
  if(top.length&&!top.some(h=>h.s.type===side)){side=top[0].s.type;build();}}
$('q').addEventListener('input',()=>{applyFind();const h=document.querySelector('.tile.hit');if(h)h.scrollIntoView({block:'nearest',behavior:'smooth'});});
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){const h=findHits(normQ($('q').value));if(h.length){open(h[0].i,h[0].p.grapheme);sayWord(h[0].p);}}});

addEventListener('resize',sizeTiles);
const qs=new URLSearchParams(location.search);
if(qs.get('side')==='consonants'||qs.get('side')==='consonant')side='consonant';
build();
if(qs.get('find')){$('q').value=qs.get('find');applyFind();}
if(qs.get('open')){const i=SND.findIndex(s=>s.id===qs.get('open'));if(i>=0)open(i);}
</script>
</body>
</html>
